<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Lesson · The Book of Code</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* 🔒 STYLING UNCHANGED */
* {
  box-sizing: border-box;
  font-family: 'Sora', system-ui, sans-serif;
}

body {
  margin: 0;
  background: #0b0e14;
  color: #e6e6eb;
}

header {
  padding: 20px 32px;
}

h1 {
  margin: 0 0 12px;
  font-weight: 600;
}

.progress-bar {
  height: 6px;
  background: #1b1f36;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6ae3ff, #7cffc4);
  transition: width 0.3s ease;
}

main {
  padding: 32px;
  display: flex;
  justify-content: center;
}

.slide {
  width: 100%;
  max-width: 900px;
}

.info {
  text-align: center;
  font-size: 18px;
  line-height: 1.75;
}

.mcq-options {
  margin-top: 28px;
  display: grid;
  gap: 12px;
}

.mcq-options button {
  padding: 14px 16px;
  background: #111525;
  border: 1px solid #242a4a;
  border-radius: 10px;
  color: inherit;
  cursor: pointer;
  text-align: left;
}

.editor-wrapper {
  display: flex;
  border: 1px solid #242a4a;
  border-radius: 12px;
  overflow: hidden;
  background: #0e1220;
  font-family: ui-monospace, monospace;
}

.line-numbers {
  background: #0c1020;
  padding: 12px 10px;
  text-align: right;
  color: #555;
  user-select: none;
}

textarea {
  flex: 1;
  background: transparent;
  color: #e6e6eb;
  border: none;
  outline: none;
  resize: none;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.console {
  margin-top: 14px;
  background: #0c1020;
  border: 1px solid #242a4a;
  border-radius: 10px;
  padding: 10px;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  min-height: 52px;
  white-space: pre-wrap;
}

footer {
  padding: 0 32px 24px;
  display: flex;
  justify-content: space-between;
}

button.primary {
  padding: 10px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: #6ae3ff;
  color: #000;
  font-weight: 500;
}

button.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>

<body>

<header>
  <h1>Demo Lesson</h1>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</header>

<main>
  <div class="slide" id="slide"></div>
</main>

<footer>
  <span></span>
  <button class="primary" id="nextBtn" disabled>Next</button>
</footer>

<script>
/* =========================
   SLIDES — DEMO: PRINT ONLY
========================= */

const slides = [
  {
    type: "info",
    text: `
      Computers do not speak naturally.<br><br>
      They follow instructions silently unless we tell them to
      <b>show something</b>.
    `
  },
  {
    type: "info",
    text: `
      In Python, the command used to display information
      on the screen is called <b>print</b>.
    `
  },
  {
    type: "info",
    text: `
      When Python reaches a <b>print</b> command,
      it sends information to the <b>console</b>.<br><br>
      The console is where program output appears.
    `
  },
  {
    type: "info",
    text: `
      Example:<br><br>
      <b>print("hello")</b><br><br>
      Python reads this line and displays the word
      <b>hello</b> exactly as written.
    `
  },
  {
    type: "info",
    text: `
      Text written inside quotation marks is called a
      <b>string</b>.<br><br>
      Quotation marks tell Python:
      “This is text, not an instruction.”
    `
  },
  {
    type: "mcq",
    question: "What does the print command do?",
    options: [
      { text: "Stores data inside the computer", correct: false },
      { text: "Displays output on the screen", correct: true },
      { text: "Stops the program", correct: false }
    ]
  },
  {
    type: "info",
    text: `
      Numbers do not need quotation marks.<br><br>
      Example:<br>
      <b>print(5)</b> displays the number 5.
    `
  },
  {
    type: "mcq",
    question: "What is the difference between print(\"5\") and print(5)?",
    options: [
      { text: "There is no difference", correct: false },
      { text: "One prints text, the other prints a number", correct: true },
      { text: "One causes an error", correct: false }
    ]
  },
  {
    type: "code",
    prompt: `
      Write code that prints the word <b>hello</b>.<br>
      Then run it.
    `,
    starter: ``,
    expectedOutput: "hello"
  },
  {
    type: "info",
    text: `
      You can print more than one word by putting them
      together inside the quotes.
    `
  },
  {
    type: "code",
    prompt: `
      Modify your code to print <b>hello world</b>.
    `,
    starter: `print("hello")`,
    expectedOutput: "hello world"
  },
  {
    type: "info",
    text: `
      You now understand the most important debugging tool
      in programming.<br><br>
      If you can <b>print</b>, you can see what your program
      is thinking.
    `
  }
];

/* =========================
   ENGINE (LOGIC ONLY)
========================= */

let current = 0;
let completed = new Set();
let mistakes = [];

const slideEl = document.getElementById("slide");
const nextBtn = document.getElementById("nextBtn");
const progressFill = document.getElementById("progressFill");

function updateProgress() {
  progressFill.style.width =
    (completed.size / slides.length) * 100 + "%";
}

function renderSlide() {
  const s = slides[current];
  slideEl.innerHTML = "";
  nextBtn.disabled = true;

  // Change button label on last slide
  nextBtn.textContent =
    current === slides.length - 1 ? "Finish" : "Next";

  if (s.type === "info") {
    slideEl.innerHTML = `<div class="info">${s.text}</div>`;
    completed.add(current);
    nextBtn.disabled = false;
  }

  if (s.type === "mcq") {
    slideEl.innerHTML = `
      <div class="info">${s.question}</div>
      <div class="mcq-options">
        ${s.options.map(o =>
          `<button data-correct="${o.correct}">${o.text}</button>`
        ).join("")}
      </div>
    `;

    let answered = false;
    slideEl.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        if (answered) return;
        answered = true;

        const correct = b.dataset.correct === "true";
        b.style.boxShadow = correct
          ? "0 0 0 2px rgba(124,255,196,0.6)"
          : "0 0 0 2px rgba(255,90,90,0.6)";

        if (correct) completed.add(current);
        else mistakes.push(current);

        nextBtn.disabled = false;
      };
    });
  }

  if (s.type === "code") {
    slideEl.innerHTML = `
      <div class="info">${s.prompt}</div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lines">1</div>
        <textarea id="editor">${s.starter}</textarea>
      </div>
      <button class="primary" id="runBtn" style="margin-top:14px;">Run</button>
      <div class="console" id="console"></div>
    `;

    const editor = document.getElementById("editor");
    const lines = document.getElementById("lines");
    const consoleEl = document.getElementById("console");

    editor.oninput = () => {
      lines.textContent = Array(editor.value.split("\n").length)
        .fill(0).map((_,i)=>i+1).join("\n");
    };

    editor.onkeydown = e => {
      const pairs = { "(":")","[":"]","{":"}","\"":"\"","'":"'","`":"`" };
      if (pairs[e.key]) {
        e.preventDefault();
        const p = editor.selectionStart;
        editor.value =
          editor.value.slice(0,p) + e.key + pairs[e.key] + editor.value.slice(p);
        editor.selectionStart = editor.selectionEnd = p + 1;
        editor.dispatchEvent(new Event("input"));
      }
    };

    document.getElementById("runBtn").onclick = () => {
      consoleEl.textContent = "";

      try {
        let output = "";
        const print = (...a) => output += a.join(" ");
        new Function("print", editor.value)(print);
        consoleEl.textContent = output;

        if (output.trim() === s.expectedOutput) {
          completed.add(current);
          nextBtn.disabled = false;
        } else {
          mistakes.push(current);
        }
      } catch (e) {
        consoleEl.textContent = "Error: " + e.message;
      }
    };
  }

  updateProgress();
}

nextBtn.onclick = () => {
  if (current === slides.length - 1) {
    window.location.href = "index.html";
    return;
  }

  if (current < slides.length - 1) {
    current++;
  } else if (mistakes.length) {
    current = mistakes.shift();
  }
  renderSlide();
};

renderSlide();
</script>

</body>
</html>
