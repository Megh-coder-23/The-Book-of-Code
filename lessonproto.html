<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Lesson · The Book of Code</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Sora', system-ui, sans-serif;
}

body {
  margin: 0;
  background: #0b0e14;
  color: #e6e6eb;
}

header {
  padding: 20px 32px;
}

h1 {
  margin: 0 0 12px;
  font-weight: 600;
}

.progress-bar {
  height: 6px;
  background: #1b1f36;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6ae3ff, #7cffc4);
  transition: width 0.3s ease;
}

main {
  padding: 32px;
  display: flex;
  justify-content: center;
}

.slide {
  width: 100%;
  max-width: 900px;
}

/* INFO */
.info {
  text-align: center;
  font-size: 18px;
  line-height: 1.7;
}

/* MCQ */
.mcq-options {
  margin-top: 28px;
  display: grid;
  gap: 12px;
}

.mcq-options button {
  padding: 14px 16px;
  background: #111525;
  border: 1px solid #242a4a;
  border-radius: 10px;
  color: inherit;
  cursor: pointer;
  text-align: left;
}

/* EDITOR */
.editor-wrapper {
  display: flex;
  border: 1px solid #242a4a;
  border-radius: 12px;
  overflow: hidden;
  background: #0e1220;
  font-family: ui-monospace, monospace;
}

.line-numbers {
  background: #0c1020;
  padding: 12px 10px;
  text-align: right;
  color: #555;
  user-select: none;
}

textarea {
  flex: 1;
  background: transparent;
  color: #e6e6eb;
  border: none;
  outline: none;
  resize: none;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* CONSOLE */
.console {
  margin-top: 14px;
  background: #0c1020;
  border: 1px solid #242a4a;
  border-radius: 10px;
  padding: 10px;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  min-height: 52px;
  white-space: pre-wrap;
}

/* FOOTER */
footer {
  padding: 0 32px 24px;
  display: flex;
  justify-content: space-between;
}

button.primary {
  padding: 10px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: #6ae3ff;
  color: #000;
  font-weight: 500;
}

button.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>

<body>

<header>
  <h1>Demo Lesson</h1>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</header>

<main>
  <div class="slide" id="slide"></div>
</main>

<footer>
  <span></span>
  <button class="primary" id="nextBtn" disabled>Next</button>
</footer>

<script>
/* =========================
   SLIDES
========================= */

const slides = [
  {
    type: "info",
    text: `Code is a set of exact instructions given to a computer.`
  },
  {
    type: "info",
    text: `Computers do not guess. They only do what is written.`
  },
  {
    type: "code",
    prompt: `Write code that prints the word <b>hello</b>.`,
    starter: ``,
    expectedOutput: "hello"
  },
  {
    type: "info",
    text: `Quotation marks tell the computer that something is text.`
  },
  {
    type: "code",
    prompt: `Now print <b>hello world</b>.`,
    starter: `print("")`,
    expectedOutput: "hello world"
  }
];

/* =========================
   ENGINE
========================= */

let current = 0;
const slideEl = document.getElementById("slide");
const nextBtn = document.getElementById("nextBtn");
const progressFill = document.getElementById("progressFill");

function updateProgress() {
  progressFill.style.width =
    (current / (slides.length - 1)) * 100 + "%";
}

function renderSlide() {
  const s = slides[current];
  slideEl.innerHTML = "";
  nextBtn.disabled = s.type !== "info";

  if (s.type === "info") {
    slideEl.innerHTML = `<div class="info">${s.text}</div>`;
  }

  if (s.type === "code") {
    slideEl.innerHTML = `
      <div class="info">${s.prompt}</div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lines">1</div>
        <textarea id="editor">${s.starter}</textarea>
      </div>
      <button class="primary" id="runBtn" style="margin-top:14px;">Run</button>
      <div class="console" id="console"></div>
    `;

    const editor = document.getElementById("editor");
    const lines = document.getElementById("lines");
    const consoleEl = document.getElementById("console");
    const initial = editor.value;

    editor.oninput = () => {
      lines.textContent = Array(editor.value.split("\n").length)
        .fill(0).map((_,i)=>i+1).join("\n");
    };

    editor.onkeydown = e => {
      const pairs = { "(":")","[":"]","{":"}","\"":"\"","'":"'","`":"`" };
      if (pairs[e.key]) {
        e.preventDefault();
        const p = editor.selectionStart;
        editor.value =
          editor.value.slice(0,p) + e.key + pairs[e.key] + editor.value.slice(p);
        editor.selectionStart = editor.selectionEnd = p + 1;
      }
    };

    document.getElementById("runBtn").onclick = () => {
      consoleEl.textContent = "";

      if (editor.value.trim() === initial.trim()) {
        consoleEl.textContent =
          "Type or modify the code before running it.";
        return;
      }

      try {
        let output = "";
        const print = (...a) => output += a.join(" ");
        new Function("print", editor.value)(print);
        consoleEl.textContent = output;

        if (output.trim() === s.expectedOutput) {
          nextBtn.disabled = false;
        }
      } catch (e) {
        consoleEl.textContent = "Error: " + e.message;
      }
    };
  }

  updateProgress();
}

nextBtn.onclick = () => {
  if (current < slides.length - 1) {
    current++;
    renderSlide();
  }
};

renderSlide();
</script>

</body>
</html>
