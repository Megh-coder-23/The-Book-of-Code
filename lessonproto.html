<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Lesson – print()</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  font-family: 'Sora', sans-serif;
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f1220;
  color: #eaeaf0;
}

#app {
  max-width: 900px;
  margin: 40px auto;
  padding: 24px;
}

h1 {
  text-align: center;
  font-weight: 600;
}

.progress {
  height: 8px;
  background: #22264a;
  border-radius: 4px;
  overflow: hidden;
  margin: 20px 0;
}

.progress > div {
  height: 100%;
  width: 0%;
  background: linear-gradient(135deg, #00c9ff 0%, #005bff 100%);
  transition: width 0.3s;
}

.slide {
  margin-top: 24px;
  min-height: 280px;
}

.center {
  text-align: center;
}

button {
  background: linear-gradient(135deg, #00c9ff 0%, #005bff 100%);
  border: none;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  background: #444;
  cursor: not-allowed;
}

.options button {
  display: block;
  width: 100%;
  margin: 10px 0;
  background: #1a1f3d;
  border: 1px solid #2c3170;
}

.options button.correct {
  box-shadow: 0 0 0 2px #4cff9a inset;
}

.options button.wrong {
  box-shadow: 0 0 0 2px #ff4c4c inset;
}

.ide {
  display: flex;
  border: 1px solid #2c3170;
  background: #0b0e1a;
  font-family: monospace;
  font-size: 14px;
}

.lines {
  padding: 8px;
  color: #555;
  user-select: none;
  text-align: right;
}

textarea {
  flex: 1;
  background: transparent;
  color: #eaeaf0;
  border: none;
  outline: none;
  padding: 8px;
  resize: none;
  font-family: monospace;
}

.output {
  background: #050714;
  border: 1px solid #2c3170;
  padding: 10px;
  margin-top: 10px;
  font-family: monospace;
  min-height: 40px;
}

.orange {
  color: orange;
  font-size: 12px;
  margin-bottom: 6px;
}

.nav {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}
</style>
</head>

<body>
<div id="app">
  <h1>Demo Lesson: The <code>print()</code> Command</h1>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="slide" class="slide"></div>

  <div class="nav">
    <button id="prev">Back</button>
    <button id="next" disabled>Next</button>
  </div>
</div>

<script>
/* ---------------- SLIDES DATA (JS FOR SCALABILITY) ---------------- */

const slides = [
  { type: "info", text: "Computers do not speak English. They follow instructions written in code." },
  { type: "info", text: "One of the simplest instructions is telling the computer to show something on the screen." },
  { type: "info", text: "In Python, the command used to display output is called print()." },
  { type: "info", text: "Anything written inside print() is sent to the output screen, exactly as instructed." },
  { type: "info", text: "print() can show text, numbers, or even the result of calculations." },
  { type: "info", text: "For example, print(3 + 4) tells Python to calculate first, then display the result." },
  { type: "info", text: "You must write the code yourself. Just clicking Run is not enough." },

  { type: "mcq", q: "What does print() do?", a: ["Stores data", "Displays output", "Runs the program"], c: 1 },
  { type: "mcq", q: "Which one is valid Python?", a: ["print 5", "print(5)", "show(5)"], c: 1 },
  { type: "mcq", q: "What will print(2 + 2) show?", a: ["22", "4", "error"], c: 1 },

  { type: "code", expected: "hello", prompt: "Write code to print the word hello" },
  { type: "code", expected: "7", prompt: "Write code to print the result of 3 + 4" },
  { type: "code", expected: "10", prompt: "Print the result of 5 + 5" },
  { type: "code", expected: "python", prompt: "Print the word python" },
  { type: "code", expected: "42", prompt: "Print the number 42" }
];

let index = 0;
let mistakes = [];
let unlocked = false;

/* ---------------- IDE HELPERS ---------------- */

function pairInput(e) {
  const pairs = { "(":")", "{":"}", "[":"]", "\"":"\"", "'":"'", "`":"`" };
  if (pairs[e.key]) {
    const t = e.target;
    const s = t.selectionStart;
    t.value = t.value.slice(0,s) + e.key + pairs[e.key] + t.value.slice(s);
    t.selectionStart = t.selectionEnd = s+1;
    e.preventDefault();
  }
}

/* ---------------- PYTHON SIM (DEMO SAFE) ---------------- */

function runPython(code) {
  code = code.trim();
  if (!code.startsWith("print(") || !code.endsWith(")")) return "error";
  let inner = code.slice(6, -1);
  try {
    if (/^[0-9+\-\s]+$/.test(inner)) return eval(inner).toString();
    if ((inner.startsWith('"') && inner.endsWith('"')) || (inner.startsWith("'") && inner.endsWith("'")))
      return inner.slice(1,-1);
    return "error";
  } catch {
    return "error";
  }
}

/* ---------------- RENDER ---------------- */

function render() {
  unlocked = false;
  document.getElementById("next").disabled = true;

  const s = slides[index];
  const slide = document.getElementById("slide");
  slide.innerHTML = "";

  document.getElementById("bar").style.width =
    Math.floor((index / slides.length) * 100) + "%";

  if (s.type === "info") {
    slide.innerHTML = `<p class="center">${s.text}</p>`;
    unlocked = true;
    document.getElementById("next").disabled = false;
  }

  if (s.type === "mcq") {
    slide.innerHTML = `<p>${s.q}</p><div class="options"></div>`;
    const o = slide.querySelector(".options");
    s.a.forEach((t,i)=>{
      const b=document.createElement("button");
      b.textContent=t;
      b.onclick=()=>{
        if(i===s.c){b.classList.add("correct");unlocked=true;}
        else{b.classList.add("wrong");mistakes.push(s);}
        document.getElementById("next").disabled=!unlocked;
      };
      o.appendChild(b);
    });
  }

  if (s.type === "code") {
    slide.innerHTML = `
      <p>${s.prompt}</p>
      <div class="ide">
        <div class="lines">1<br>2<br>3<br>4</div>
        <textarea rows="4"></textarea>
      </div>
      <button id="run">Run</button>
      <div class="output" id="out"></div>
    `;
    const ta = slide.querySelector("textarea");
    ta.addEventListener("keydown", pairInput);

    document.getElementById("run").onclick = ()=>{
      if (!ta.value.trim()) return;
      const out = runPython(ta.value);
      document.getElementById("out").textContent = out;
      if (out === s.expected) {
        unlocked = true;
        document.getElementById("next").disabled = false;
      } else {
        mistakes.push(s);
      }
    };
  }
}

/* ---------------- NAV ---------------- */

document.getElementById("next").onclick = ()=>{
  if (!unlocked) return;
  index++;
  if (index >= slides.length) {
    window.location.href = "index.html";
    return;
  }
  render();
};

document.getElementById("prev").onclick = ()=>{
  if (index>0){index--;render();}
};

render();
</script>
</body>
</html>
