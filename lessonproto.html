<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Lesson · The Book of Code</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* 🔒 STYLING UNCHANGED */
* {
  box-sizing: border-box;
  font-family: 'Sora', system-ui, sans-serif;
}

body {
  margin: 0;
  background: #0b0e14;
  color: #e6e6eb;
}

header {
  padding: 20px 32px;
}

h1 {
  margin: 0 0 12px;
  font-weight: 600;
}

.progress-bar {
  height: 6px;
  background: #1b1f36;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6ae3ff, #7cffc4);
  transition: width 0.3s ease;
}

main {
  padding: 32px;
  display: flex;
  justify-content: center;
}

.slide {
  width: 100%;
  max-width: 900px;
}

.info {
  text-align: center;
  font-size: 18px;
  line-height: 1.75;
}

.mistake-tag {
  text-align: center;
  color: #ffb86c;
  font-size: 13px;
  margin-bottom: 12px;
  letter-spacing: 0.04em;
}

.mcq-options {
  margin-top: 28px;
  display: grid;
  gap: 12px;
}

.mcq-options button {
  padding: 14px 16px;
  background: #111525;
  border: 1px solid #242a4a;
  border-radius: 10px;
  color: inherit;
  cursor: pointer;
  text-align: left;
}

.editor-wrapper {
  display: flex;
  border: 1px solid #242a4a;
  border-radius: 12px;
  overflow: hidden;
  background: #0e1220;
  font-family: ui-monospace, monospace;
}

.line-numbers {
  background: #0c1020;
  padding: 12px 10px;
  text-align: right;
  color: #555;
  user-select: none;
  white-space: pre;
}

textarea {
  flex: 1;
  background: transparent;
  color: #e6e6eb;
  border: none;
  outline: none;
  resize: none;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.console {
  margin-top: 14px;
  background: #0c1020;
  border: 1px solid #242a4a;
  border-radius: 10px;
  padding: 10px;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  min-height: 52px;
  white-space: pre-wrap;
}

footer {
  padding: 0 32px 24px;
  display: flex;
  justify-content: space-between;
}

button.primary {
  padding: 10px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: #6ae3ff;
  color: #000;
  font-weight: 500;
}

button.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>

<body>

<header>
  <h1>Demo Lesson</h1>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</header>

<main>
  <div class="slide" id="slide"></div>
</main>

<footer>
  <span></span>
  <button class="primary" id="nextBtn" disabled>Next</button>
</footer>

<script>
/* =========================
   SLIDES (UNCHANGED)
========================= */

const slides = [
  { type:"info", text:`A computer follows instructions exactly.` },
  { type:"info", text:`Programs need to show results to humans.` },
  { type:"info", text:`Python uses <b>print</b> to display output.` },
  {
    type:"mcq",
    question:"What does print do?",
    options:[
      {text:"Stores data",correct:false},
      {text:"Displays output",correct:true},
      {text:"Ends program",correct:false}
    ]
  },
  {
    type:"code",
    prompt:`Print the word <b>hello</b>.`,
    starter:"",
    expectedOutput:"hello"
  }
];

/* =========================
   ENGINE (UPDATED LOGIC)
========================= */

let current = 0;
let completed = new Set();
let mistakes = [];
let recycling = false;

const slideEl = document.getElementById("slide");
const nextBtn = document.getElementById("nextBtn");
const progressFill = document.getElementById("progressFill");

function updateProgress() {
  progressFill.style.width =
    (completed.size / slides.length) * 100 + "%";
}

function renderSlide() {
  const s = slides[current];
  slideEl.innerHTML = "";
  nextBtn.disabled = true;

  if (recycling) {
    slideEl.innerHTML += `<div class="mistake-tag">previous mistake</div>`;
  }

  if (s.type === "info") {
    slideEl.innerHTML += `<div class="info">${s.text}</div>`;
    completed.add(current);
    nextBtn.disabled = false;
  }

  if (s.type === "mcq") {
    slideEl.innerHTML += `
      <div class="info">${s.question}</div>
      <div class="mcq-options">
        ${s.options.map(o =>
          `<button data-correct="${o.correct}">${o.text}</button>`
        ).join("")}
      </div>
    `;

    let answered = false;
    slideEl.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        if (answered) return;
        answered = true;

        const correct = b.dataset.correct === "true";
        b.style.boxShadow = correct
          ? "0 0 0 2px rgba(124,255,196,0.6)"
          : "0 0 0 2px rgba(255,90,90,0.6)";

        if (correct) {
          completed.add(current);
          recycling = false;
        } else {
          if (!mistakes.includes(current)) mistakes.push(current);
        }

        nextBtn.disabled = false;
      };
    });
  }

  if (s.type === "code") {
    slideEl.innerHTML += `
      <div class="info">${s.prompt}</div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lines">1</div>
        <textarea id="editor">${s.starter}</textarea>
      </div>
      <button class="primary" id="runBtn" style="margin-top:14px;">Run</button>
      <div class="console" id="console"></div>
    `;

    const editor = document.getElementById("editor");
    const lines = document.getElementById("lines");
    const consoleEl = document.getElementById("console");

    editor.oninput = () => {
      const count = editor.value.split("\n").length;
      lines.textContent = Array.from({length:count},(_,i)=>i+1).join("\n");
    };

    document.getElementById("runBtn").onclick = () => {
      try {
        let output = "";
        const print = (...a)=>output+=a.join(" ");
        new Function("print",editor.value)(print);
        consoleEl.textContent = output;

        if (output.trim() === s.expectedOutput) {
          completed.add(current);
          recycling = false;
          nextBtn.disabled = false;
        } else {
          if (!mistakes.includes(current)) mistakes.push(current);
        }
      } catch(e){
        consoleEl.textContent = "Error: " + e.message;
      }
    };
  }

  if (current === slides.length - 1 && mistakes.length === 0) {
    nextBtn.textContent = "Finish";
  } else {
    nextBtn.textContent = "Next";
  }

  updateProgress();
}

nextBtn.onclick = () => {
  if (current === slides.length - 1) {
    if (mistakes.length > 0) {
      current = mistakes.shift();
      recycling = true;
    } else {
      location.href = "index.html";
      return;
    }
  } else {
    current++;
    recycling = false;
  }
  renderSlide();
};

renderSlide();
</script>

</body>
</html>
